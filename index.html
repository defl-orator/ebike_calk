<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смены</title>
<meta name="theme-color" content="#15110a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbf4d9" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Смены">
<style>
  :root {
    --bg: #15110a;
    --surface: #1e1910;
    --surface2: #2a2314;
    --line: #3d3419;
    --text: #f6efd6;
    --muted: #a99f7d;
    --accent: #f4c430;
    --accent-ink: #1a1400;
    --warn: #ff9d3c;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbf4d9;
      --surface: #fffbea;
      --surface2: #f6ecc0;
      --line: #e8d99a;
      --text: #2a2208;
      --muted: #7d6e38;
      --accent: #a97c00;
      --accent-ink: #fffbea;
      --warn: #c2570c;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 12px; }
  p { margin: 0; }
  button, input { font: inherit; color: inherit; }

  .bar { display: flex; justify-content: flex-end; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 14px; border: 1px solid transparent; background: transparent;
    color: var(--muted); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn[aria-expanded="true"] { color: var(--accent); background: var(--surface); border-color: var(--line); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }

  .times { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 8px; }
  .time { min-width: 0; display: block; }
  input[type="time"] { min-width: 0; }
  .time span { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px 4px; }
  .sep { color: var(--muted); font-size: 22px; padding-bottom: 16px; }
  input[type="time"], input[type="text"] {
    width: 100%; background: var(--surface2); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 12px; min-height: 48px; outline: none;
  }
  input[type="time"] {
    font-size: 23px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums;
    min-height: 60px; padding: 6px 4px;
  }
  input[type="time"]::-webkit-calendar-picker-indicator { display: none; }
  input[type="time"]::-webkit-datetime-edit { padding: 0; }
  input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .go {
    width: 100%; margin-top: 14px; min-height: 52px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px;
  }
  .go:disabled { background: var(--surface2); color: var(--muted); cursor: default; }
  .go:not(:disabled):active { filter: brightness(.92); }

  .fields { display: grid; gap: 12px; }
  .field span { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px 2px; }
  .field input { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ghost { background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; min-height: 40px; cursor: pointer; }
  .ghost:active { background: var(--surface2); }
  .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  [hidden] { display: none !important; }

  .note { color: var(--muted); font-size: 14px; padding: 0 4px; }
  .note.error { color: var(--warn); }

  .results { display: grid; gap: 8px; }
  details.var { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
  details.var.best { border-color: var(--accent); }
  details.var > summary {
    list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto 18px; align-items: center; gap: 10px;
    padding: 14px 14px 14px 16px;
  }
  details.var > summary::-webkit-details-marker { display: none; }
  .s-title { font-weight: 700; font-size: 16px; }
  .best .s-title::after { content: "★"; color: var(--accent); margin-left: 6px; font-size: 13px; }
  .s-times { color: var(--muted); font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .s-total { font-weight: 700; font-size: 17px; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; }
  details[open] > summary .chev { transform: rotate(180deg); }
  sup { font-size: 10px; margin-left: 1px; color: var(--muted); }

  .body { padding: 0 14px 14px; display: grid; gap: 12px; }
  .sub { color: var(--muted); font-size: 13px; }

  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  .c-band { fill: var(--accent); opacity: .16; }
  .c-strip { fill: var(--accent); }
  .c-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
  .c-res { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 3 3; opacity: .75; }
  .c-axis { stroke: var(--line); stroke-width: 1; }
  .c-line { fill: none; stroke: var(--text); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .c-txt { fill: var(--muted); font-size: 10px; font-family: inherit; }
  .c-txt.warn { fill: var(--warn); }

  ol.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .slot {
    display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px;
    background: var(--surface2); border-radius: 12px; padding: 8px 10px;
  }
  .slot .ic {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
    background: var(--accent); color: var(--accent-ink);
  }
  .slot.charge .ic { background: transparent; border: 1.5px solid var(--warn); color: var(--warn); }
  .slot .t { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .slot .s { font-size: 12.5px; color: var(--muted); }
  .slot .d { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
  .slot.charge .d { color: var(--warn); }
  .slot.free { background: transparent; border: 1px dashed var(--line); }
  .slot.free .ic { background: transparent; color: var(--muted); border: 1.5px dashed var(--line); }
  .slot.free .t, .slot.free .d { color: var(--muted); font-weight: 600; }
  .slot.free .t { font-size: 15px; }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .delta { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="bar">
    <button class="icon-btn" id="gear" type="button" aria-label="Настройки батареи" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
    </button>
  </div>

  <section class="card" id="settings" hidden>
    <div class="fields">
      <label class="field"><span>Реально проезжаю за смену, ч</span><input id="work" type="text" inputmode="decimal" autocomplete="off"></label>
      <label class="field"><span>Теоретический полный запас хода, ч</span><input id="full" type="text" inputmode="decimal" autocomplete="off"></label>
      <label class="field"><span>Полная зарядка, ч</span><input id="charge" type="text" inputmode="decimal" autocomplete="off"></label>
    </div>
    <div class="actions"><button class="ghost" id="reset" type="button">Сбросить</button></div>
  </section>

  <form class="card" id="form" novalidate>
    <div class="times">
      <label class="time"><span>С</span><input id="start" type="time" required></label>
      <span class="sep" aria-hidden="true">→</span>
      <label class="time"><span>До</span><input id="end" type="time" required></label>
    </div>
    <button class="go" id="go" type="submit" disabled>Рассчитать</button>
  </form>

  <p id="note" class="note" hidden></p>
  <section id="results" class="results" aria-live="polite"></section>
  <noscript>Для работы приложения нужен JavaScript.</noscript>
</main>

<script src="calc.js"></script>
<script>
(function () {
  'use strict';
  var C = window.ShiftCalc;
  var KEY = 'ebike-shifts-v2';
  var DEF = { work: '5', full: '6', charge: '5,5' };
  var sids = Object.keys(DEF);
  var BOLT = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M13.2 2 4.5 13.6h6.1L9.5 22l9-11.9h-6.3z"/></svg>';
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 5 5 5-5"/></svg>';

  function $(id) { return document.getElementById(id); }
  function load() {
    try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY)) || {}); }
    catch (e) { return Object.assign({}, DEF); }
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function parseNum(s) { return parseFloat(String(s == null ? '' : s).replace(',', '.')); }
  function parseTime(s) {
    var m = /^(\d{1,2}):(\d{2})/.exec(s || '');
    return m ? (+m[1]) * 60 + (+m[2]) : NaN;
  }

  var st = load();
  sids.forEach(function (id) { $(id).value = st[id]; });
  var shown = false;
  var current = null;

  function pct(x) { return Math.round(x) + '%'; }
  function tm(t) { var d = C.dayShift(t); return C.fmtTime(t) + (d > 0 ? '<sup>+1</sup>' : ''); }
  function plain(t) { return C.fmtTime(t) + (C.dayShift(t) > 0 ? ' (+1)' : ''); }
  function range(a, b) { return tm(a) + ' – ' + tm(b); }

  var TITLES = {
    max:   ['Максимум часов', 'две смены, примерно поровну'],
    front: ['Больше в начале', 'длинная смена, потом короткая'],
    back:  ['Больше в конце', 'короткая смена, потом длинная'],
    one:   ['Одна смена', 'без подзарядки днём']
  };

  function params() {
    var w = parseNum(st.work), f = parseNum(st.full), ch = parseNum(st.charge);
    if (!(w > 0) || !(f > 0) || !(ch > 0)) return { error: 'Проверьте настройки батареи.' };
    if (w > f) return { error: 'Реальный запас хода не может быть больше полного.' };
    return { cap: f, reserve: 100 * (1 - w / f), charge: ch, soc0: 100, shortPct: 65, slack: 'break' };
  }

  function chart(v, res) {
    var VW = 320, VH = 112, L = 34, R = 10, Tp = 8, H = 68;
    var W = VW - L - R, S = res.S, T = res.T, p = res.p;
    function X(t) { return (L + (t - S) / T * W).toFixed(1); }
    function Y(s) { return (Tp + (1 - s / 100) * H).toFixed(1); }
    var out = ['<svg class="chart" viewBox="0 0 ' + VW + ' ' + VH + '" role="img" aria-label="График заряда батареи">'];

    v.items.filter(function (i) { return i.type === 'work'; }).forEach(function (i) {
      var w = (X(i.end) - X(i.start)).toFixed(1);
      out.push('<rect class="c-band" x="' + X(i.start) + '" y="' + Tp + '" width="' + w + '" height="' + H + '" rx="3"/>');
      out.push('<rect class="c-strip" x="' + X(i.start) + '" y="' + (Tp + H + 6) + '" width="' + w + '" height="5" rx="2.5"/>');
    });
    out.push('<line class="c-grid" x1="' + L + '" x2="' + (VW - R) + '" y1="' + Y(100) + '" y2="' + Y(100) + '"/>');
    out.push('<text class="c-txt" x="' + (L - 6) + '" y="' + (+Y(100) + 3.5) + '" text-anchor="end">100%</text>');
    if (p.reserve > 0) {
      out.push('<line class="c-res" x1="' + L + '" x2="' + (VW - R) + '" y1="' + Y(p.reserve) + '" y2="' + Y(p.reserve) + '"/>');
      out.push('<text class="c-txt warn" x="' + (L - 6) + '" y="' + (+Y(p.reserve) + 3.5) + '" text-anchor="end">' + Math.round(p.reserve) + '%</text>');
    }
    out.push('<line class="c-axis" x1="' + L + '" x2="' + (VW - R) + '" y1="' + Y(0) + '" y2="' + Y(0) + '"/>');

    var pts = [[S, p.soc0]], cur = p.soc0;
    v.items.forEach(function (it) {
      if (it.type === 'work') { pts.push([it.start, cur]); cur = it.to; pts.push([it.end, cur]); }
      else if (it.type === 'charge') {
        var tCap = it.start + (100 - it.from) / res.g;
        if (tCap < it.end - 0.5) { pts.push([tCap, 100]); pts.push([it.end, 100]); }
        else pts.push([it.end, it.to]);
        cur = it.to;
      }
    });
    pts.push([S + T, cur]);
    out.push('<polyline class="c-line" points="' + pts.map(function (q) { return X(q[0]) + ',' + Y(q[1]); }).join(' ') + '"/>');

    var hStep = T <= 6 * 60 ? 1 : (T <= 14 * 60 ? 2 : 3);
    for (var h = Math.ceil(S / 60); h * 60 <= S + T; h++) {
      if (h % hStep !== 0) continue;
      var x = +X(h * 60);
      if (x < L - 2 || x > VW - R + 2) continue;
      out.push('<text class="c-txt" x="' + x.toFixed(1) + '" y="' + (VH - 2) + '" text-anchor="middle">' + (h % 24) + '</text>');
    }
    out.push('</svg>');
    return out.join('');
  }

  function slots(v) {
    var n = 0;
    return '<ol class="slots">' + v.items.map(function (it) {
      if (it.type === 'work') {
        n++;
        return '<li class="slot"><span class="ic">' + n + '</span><div><div class="t">' + range(it.start, it.end) +
          '</div><div class="s">заряд ' + pct(it.from) + ' → ' + pct(it.to) + '</div></div><span class="d">' + C.fmtDur(it.dur) + '</span></li>';
      }
      if (it.type === 'charge') {
        var extra = it.dur - it.needed >= 10 ? ' · нужно ≈ ' + C.fmtDur(it.needed) : '';
        return '<li class="slot charge"><span class="ic">' + BOLT + '</span><div><div class="t">' + range(it.start, it.end) +
          '</div><div class="s">зарядка ' + pct(it.from) + ' → ' + pct(it.to) + extra + '</div></div><span class="d">' + C.fmtDur(it.dur) + '</span></li>';
      }
      return '<li class="slot free"><span class="ic">–</span><div><div class="t">' + range(it.start, it.end) +
        '</div></div><span class="d">свободно ' + C.fmtDur(it.dur) + '</span></li>';
    }).join('') + '</ol>';
  }

  function workTimes(v) {
    return v.items.filter(function (i) { return i.type === 'work'; })
      .map(function (i) { return tm(i.start) + '–' + tm(i.end); }).join(' · ');
  }
  function copyText(v) {
    var w = v.items.filter(function (i) { return i.type === 'work'; });
    return 'Смены: ' + w.map(function (i) { return plain(i.start) + '–' + plain(i.end); }).join(', ') + ' · всего ' + C.fmtDur(v.work);
  }

  function showNote(text, isError) {
    var n = $('note');
    if (!text) { n.hidden = true; return; }
    n.hidden = false; n.textContent = text; n.className = 'note' + (isError ? ' error' : '');
  }
  function clearResults() {
    shown = false; current = null;
    $('results').innerHTML = ''; showNote('');
  }

  function calculate() {
    var s = parseTime($('start').value), e = parseTime($('end').value);
    var p = params();
    if (p.error) { clearResults(); showNote(p.error, true); return; }
    var res = C.compute(s, e, p);
    if (res.error) { clearResults(); showNote(res.error, true); return; }
    shown = true; current = res;
    showNote(res.notes.join(' '), false);

    var badgeDone = false;
    $('results').innerHTML = res.variants.map(function (v, i) {
      var t = TITLES[v.kind], sub = t[1];
      if (v.kind === 'one') sub = res.T <= res.U0 ? 'заряда хватает на всё окно' : 'без подзарядки днём';
      var isBest = !badgeDone && res.variants.length > 1 && v.work === res.bestWork && v.kind !== 'one';
      if (isBest) badgeDone = true;
      var delta = res.bestWork - v.work;
      var deltaTxt = isBest ? 'больше всего работы' : (delta >= 5 ? '−' + C.fmtDur(delta) + ' к максимуму' : '');
      return '<details class="var' + (isBest ? ' best' : '') + '"><summary>' +
        '<div><div class="s-title">' + t[0] + '</div><div class="s-times">' + workTimes(v) + '</div></div>' +
        '<span class="s-total">' + C.fmtDur(v.work) + '</span>' + CHEV + '</summary>' +
        '<div class="body"><p class="sub">' + sub + '</p>' + chart(v, res) + slots(v) +
        '<div class="foot"><span class="delta">' + deltaTxt + '</span><button class="ghost copy" type="button" data-i="' + i + '">Копировать</button></div></div>' +
        '</details>';
    }).join('');
  }

  function updateGo() {
    $('go').disabled = isNaN(parseTime($('start').value)) || isNaN(parseTime($('end').value));
  }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if ($('go').disabled) return;
    calculate();
    var r = $('results').firstElementChild;
    if (r && r.scrollIntoView) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  ['start', 'end'].forEach(function (id) {
    $(id).addEventListener('input', function () { updateGo(); if (shown) clearResults(); });
    $(id).addEventListener('change', function () { updateGo(); if (shown) clearResults(); });
  });

  $('gear').addEventListener('click', function () {
    var open = $('settings').hidden;
    $('settings').hidden = !open;
    this.setAttribute('aria-expanded', String(open));
  });
  sids.forEach(function (id) {
    $(id).addEventListener('input', function () {
      st[id] = $(id).value; save(st);
      if (shown) calculate();
    });
  });
  $('reset').addEventListener('click', function () {
    sids.forEach(function (id) { st[id] = DEF[id]; $(id).value = DEF[id]; });
    save(st);
    if (shown) calculate();
  });

  $('results').addEventListener('click', function (ev) {
    var btn = ev.target.closest('.copy');
    if (!btn || !current) return;
    var text = copyText(current.variants[+btn.getAttribute('data-i')]);
    function done() { var old = btn.textContent; btn.textContent = 'Скопировано'; setTimeout(function () { btn.textContent = old; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt('Скопируйте текст:', text); });
    } else {
      window.prompt('Скопируйте текст:', text);
    }
  });

  updateGo();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
